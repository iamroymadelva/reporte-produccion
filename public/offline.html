<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#065f46" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Sin conexión · Reporte de Producción</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; min-height: 100dvh; margin: 0; padding: 1.5rem; place-items: center; background: #f1f5f9; color: #0f172a; }
      main { width: min(100%, 32rem); border: 1px solid #cbd5e1; border-radius: 1rem; background: white; padding: clamp(1.5rem, 5vw, 2.5rem); box-shadow: 0 20px 45px rgb(15 23 42 / 0.12); text-align: center; }
      img { width: 5rem; height: 5rem; border-radius: 1.25rem; }
      h1 { margin: 1.25rem 0 0; font-size: clamp(1.75rem, 6vw, 2.25rem); }
      p { margin: 0.75rem auto 0; max-width: 25rem; color: #475569; line-height: 1.6; }
      a { display: inline-flex; min-height: 3rem; margin-top: 1.5rem; align-items: center; justify-content: center; border-radius: 0.75rem; background: #047857; padding: 0.75rem 1.25rem; color: white; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #6ee7b7; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="80" height="80" />
      <h1>Sin conexión</h1>
      <p>No fue posible cargar esta página. Verifica tu conexión e inténtalo nuevamente.</p>
      <a href="/">Intentar nuevamente</a>
    </main>
  </body>
</html>
